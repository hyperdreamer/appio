derivation:
  signature_normalization: Collapse ASCII whitespace runs to one space; trim; SHA-256 over UTF-8 signature bytes without trailing newline.
  lane_policy: Preserve every source-plan Lane verbatim. Sequence is lane-local from 1; source_sequence preserves the original phase label. Each source lane has one task.
  ownership_policy: Preserve source-plan Ownership globs exactly. They are statically disjoint; no ownership serialization or pattern changes are needed.
  exclusive_resources_policy: 'No global runtime resource is shared: tests use private temporary fixture trees/databases and offscreen Qt; each lane has its own worktree.'
  validation_policy: Deduplicate the plan test commands; encode offscreen environment assignment through env argv; omit all plan commit commands. Cwd lane means the lane worktree root.
  validation_timeouts: Per-task timeout_seconds are conservative orchestration defaults (120-300 seconds; full suite 600), inferred rather than specified by the plan.
  interface_policy: Only repository-produced interfaces are producer/consumer records; Python stdlib, PyQt6 and pytest are environment requirements. Result fields and query signatures are extracted from specification section 8.
  json_sampler_seam: Task 6 implements specification-defined structural JSON mappings independently of concrete Task 7 SamplerState; Task 8 binds checkpoint mappings to SamplerState. This avoids inventing a Task 6/7 dependency cycle.
  query_service_seam: The UI-local QueryService protocol binds the specified Task 10 ranking/disk_share functions; no unplanned concrete query service class or module is prescribed. selected_app_id supplies the local ID required by disk_share; AppKey remains the external identity.
  acceptance_output: Task 12 produces a fixture/assertion artifact interface and no production API.
  added_dependencies:
    - task: T-006
      depends_on: T-002
      reason: Task 6 explicitly consumes AppKey validation defined by Task 2; Task 2 is absent from its source depends_on. This newly orders a potentially parallel pair.
      reduces_source_parallelism: true
    - task: T-008
      depends_on: T-001
      reason: Direct consumption of Task 1 shared contracts/validators; make its existing transitive prerequisite direct.
      reduces_source_parallelism: false
    - task: T-010
      depends_on: T-001
      reason: Direct consumption of Task 1 shared contracts/validators; make its existing transitive prerequisite direct.
      reduces_source_parallelism: false
    - task: T-011
      depends_on: T-001
      reason: Direct consumption of Task 1 shared contracts/validators; make its existing transitive prerequisite direct.
      reduces_source_parallelism: false
    - task: T-012
      depends_on: T-001
      reason: Direct consumption of Task 1 shared contracts/validators; make its existing transitive prerequisite direct.
      reduces_source_parallelism: false
    - task: T-012
      depends_on: T-007
      reason: The acceptance implementation explicitly connects the production sampler; make its existing transitive prerequisite direct.
      reduces_source_parallelism: false
