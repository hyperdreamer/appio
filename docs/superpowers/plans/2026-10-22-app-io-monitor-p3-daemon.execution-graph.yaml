derivation:
  signature_normalization: Collapse ASCII whitespace runs to one space; trim; SHA-256 over UTF-8 signature bytes without trailing newline.
  lane_policy: Preserve all ten source Scheduling lanes and contiguous sequences verbatim. Every task is present exactly once; same-lane predecessor edges are explicit.
  ownership_policy: Use exactly the Create/Modify/Test file paths; remove source line-range anchors only. Exact paths are literal POSIX globs; no broad directory claims. All task ownership sets are disjoint, including concurrent pairs; no ownership serialization is needed.
  exclusive_resources_policy: 'No shared runtime resource: each lane uses private tmp_path trees/databases, injected credentials/service/session state, virtual clocks and offscreen Qt; no real system service, root helper or host process collection is run.'
  interface_policy: One cohesive public interface per producing task, extracted from every Produces bullet. Mirror task produces/consumes under interfaces. Existing repository APIs are pinned immutable baseline_interfaces, resolved by producer_source rather than fictional tasks; every baseline consumer names its exact digest. No baseline producer is runnable or added to lanes.
  baseline_policy: Static Python AST declarations pin actual APIs without importing runtime dependencies. Source and spec hashes are exact-byte pins. Inherited API declarations on modifying tasks are recorded as baseline consumes; new methods are supplied only by their P3 producer. Baseline interfaces describe pre-change APIs, not new handover semantics.
  validation_policy: Deduplicate all explicit unprivileged pytest commands, encode their three environment assignments as env argv, preserve the full-suite command and dry-run acceptance script. Exclude all git commands and privileged --run/--allow-session-termination execution. Cwd lane is the lane worktree root.
  validation_timeouts: 300 seconds per focused command/dry-run, 600 seconds for the complete suite; orchestration defaults inferred rather than promised runtime.
  conditional_artifact_check: Task 6 also requests systemd-analyze verify data/systemd/appio-iod.service only when available; keep it informational outside blocking validation because the not-yet-installed /usr/bin/appio-iod may legitimately make it fail. No installation or system service invocation is authorized.
  safety_limits: D1-D5 are unchanged plan rulings/limitations. The manifest makes no real-host accounting or lossless bidirectional-handover claim. Production filesystem paths in signatures are contracts, not ownership paths or commands to execute.
  added_dependencies:
    - task: T-009
      depends_on: T-007
      reason: Task 9 explicitly consumes Task 7 SetupIdentity/SetupDeps/CommandRunner; already ordered through Task 8.
      reduces_source_parallelism: false
    - task: T-010
      depends_on: T-007
      reason: Task 10 explicitly consumes Task 7 parsing/trusted-runtime/runner contracts; already ordered through Task 8.
      reduces_source_parallelism: false
    - task: T-013
      depends_on: T-007
      reason: Task 13 explicitly imports CommandResult and consumes the fixed six helper verbs; already ordered through Task 10.
      reduces_source_parallelism: false
  unstated_inferences:
    - Use stable T-001..T-014 identifiers and appio.p3.<boundary>.v1 interface IDs.
    - Group each task public contract into one interface; pin existing APIs separately instead of assigning their authorship to P3 tasks.
    - A dependency consumer pins its prerequisite complete public interface, including acceptance prerequisites not individually restated in its Consumes bullet.
    - Line anchors are inspection locations, not part of an owned filename; no write permission is widened.
    - 'No extra serialization is needed: all additional API edges were already transitively ordered.'
