[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "appio"
version = "0.1.3"
description = "App I/O monitor: P1 contracts, storage, and Qt views"
requires-python = ">=3.14"
dependencies = [
  "PyQt6>=6.6",
]

[project.scripts]
appio = "appio.__main__:main"
appio-iod = "appio.iod:main"

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-qt>=4.4",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["appio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
